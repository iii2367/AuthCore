services:
  postgres:
    image: postgres:17
    container_name: auth-core-postgres
    environment:
      POSTGRES_DB: auth-core
      POSTGRES_USER: auth-core
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth-core -d auth-core"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
